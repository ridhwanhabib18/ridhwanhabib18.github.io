<text x="72" y="100.0" font-size="11.5" text-anchor="end" fill="#52514e">40</text>
<text transform="translate(24 228) rotate(-90)" font-size="12" text-anchor="middle" fill="#52514e">PID output / servo angle (degrees)</text>
