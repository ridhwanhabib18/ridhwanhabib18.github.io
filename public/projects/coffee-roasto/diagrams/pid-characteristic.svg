<text x="564.0" y="88.0" font-size="12.5" font-weight="600" fill="#2a78d6">PID output = 22.295 x e</text>
<text x="542.0" y="352.0" font-size="12.5" font-weight="600" fill="#eb6834">valve servo angle = 40 - PID</text>
<text x="398.7" y="226.0" font-size="11.5" text-anchor="middle" fill="#52514e">only the valve moves</text>
<text x="398.7" y="241.0" font-size="11.5" text-anchor="middle" fill="#52514e">(proportional band</text>
<text x="398.7" y="255.0" font-size="11.5" text-anchor="middle" fill="#52514e">1.79 degrees wide)</text>
<text x="505.4" y="116.0" font-size="11.5" fill="#52514e">valve at 0: open, gas flows</text>
<text x="88.0" y="336.0" font-size="11.5" fill="#52514e">valve at 40: closed</text>
<text x="80" y="414" font-size="13" font-weight="600" fill="#0b0b0b">B. Burner relay: switches only at the two limits and keeps its state in between</text>
<rect x="300.0" y="440" width="197.4" height="160" fill="#f0efec"/>
<line x1="80" x2="740" y1="600.0" y2="600.0" stroke="#e3e2de"/>
