<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" width="780" height="700" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">PID output, valve angle and burner state against the temperature error</title>
<desc id="d">PID output rises with a gain of 22.295 from 0 at an error of 0 degrees to 40 at an error of 1.79 degrees and stays at 40 above that. The valve angle is 40 minus the PID output. The burner turns on at an error of 1.79 degrees and off at 0 degrees; between them it keeps its last state.</desc>
<rect width="780" height="700" fill="#fcfcfb"/>
<text x="80" y="30" font-size="17" font-weight="600" fill="#0b0b0b">PID characteristic of the firmware (KP 21.095, KI 0.2, KD not used)</text>
<text x="80" y="50" font-size="12.5" fill="#52514e">error e = set point - bean temperature; effective gain KP + KI + 1 = 22.295</text>
<text x="80" y="82" font-size="13" font-weight="600" fill="#0b0b0b">A. Controller output and valve angle (0 to 40)</text>
<rect x="300.0" y="96" width="197.4" height="264" fill="#f0efec"/>
<line x1="80" x2="740" y1="360.0" y2="360.0" stroke="#e3e2de"/>
