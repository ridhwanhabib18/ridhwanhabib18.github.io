<text x="410" y="640" font-size="12" text-anchor="middle" fill="#52514e">error e = set point - bean temperature (degrees C)</text>
<text x="80" y="670" font-size="12" fill="#52514e">Example: with a set point of 150 C the burner turns on below 148.2 C and off at 150 C or above.</text>
