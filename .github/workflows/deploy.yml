name: Deploy to GitHub Pages

# Target: https://ridhwanhabib18.github.io (user site, so base path "/").
# In the public repository named ridhwanhabib18.github.io, set Settings > Pages > Source = GitHub Actions.
# Add the repository secret GUARDRAIL_BLOCKLIST (comma-separated internal code names) for the guardrail lint.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GUARDRAIL_BLOCKLIST: ${{ secrets.GUARDRAIL_BLOCKLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
