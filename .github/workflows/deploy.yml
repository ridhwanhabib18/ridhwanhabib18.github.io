name: Deploy to GitHub Pages

# Target: https://ridhwanhabib18.github.io (user site, so base path "/").
# In the public repository named ridhwanhabib18.github.io, set Settings > Pages > Source = GitHub Actions.
# Optional: add the repository secret GUARDRAIL_BLOCKLIST (comma-separated terms) to enable the code-name scan in CI.
# Without it the guardrail only warns; currency and hour-count rules still fail the build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GUARDRAIL_BLOCKLIST: ${{ secrets.GUARDRAIL_BLOCKLIST }}
      # Optional visit statistics (GoatCounter). Leave the variable unset to keep them off.
      VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Typst
        env:
          TYPST_VERSION: v0.14.2
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
          tar -xJf typst.tar.xz
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      - name: Compile resume PDFs
        run: npm run resume
      - run: npm test
      - run: npm run build
      - name: Layout tests (phone and desktop widths)
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Reference API tests
        run: dotnet test reference-api --configuration Release

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, api]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
