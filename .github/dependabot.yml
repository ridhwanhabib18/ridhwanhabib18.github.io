# Weekly pull requests for dependency and GitHub Actions updates.
# CI (tests, build, layout tests) runs on each pull request; merge when it is green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
